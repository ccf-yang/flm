name: flm
description: A clean, local-first iOS music player.
publish_to: "none"
version: 1.0.10+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  webview_flutter: ^4.10.0
  # In-process JS runtime for the custom-source sandbox. iOS uses the system
  # JavaScriptCore, so audio-source link resolution keeps running while the
  # app is backgrounded (a WKWebView's JS is frozen behind the lock screen).
  flutter_js: ^0.8.0
  dio: ^5.7.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/engine.html
    - assets/js/user_source.html
    - assets/icon/
