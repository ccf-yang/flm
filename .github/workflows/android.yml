name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create or update a GitHub Release with the APK"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android/ is not committed; tool/bootstrap_android.sh generates it, and
      # Gradle only needs an SDK. The runner image already ships one with the
      # licenses accepted, and the Android plugin downloads whatever
      # platform/build-tools the Flutter template asks for, so this step just
      # pre-accepts licenses and pre-fetches the usual packages. It can never
      # fail the build: if the image layout differs, Gradle does the work.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR=$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$MGR" ]; then
            yes | "$MGR" --licenses >/dev/null 2>&1
            "$MGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1
          fi
          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=${MGR:-not found, relying on Gradle auto-download}"
          exit 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      # Fail early with file/line errors before the Gradle build.
      - name: Analyze Dart (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Generate Android project
        run: bash tool/bootstrap_android.sh

      - name: Build release APK (universal, debug-signed)
        run: flutter build apk --release

      - name: Stage artifact
        run: |
          set -e
          SRC=build/app/outputs/flutter-apk/app-release.apk
          test -f "$SRC"
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          cp "$SRC" "flm-${V}.apk"
          ls -lh flm-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-apk
          path: flm-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read version from pubspec
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The iOS workflow publishes v<version>; keep the Android release on
          # its own tag so the two artifacts never overwrite each other.
          echo "tag=android-v$(echo "$V" | tr '+' '-')" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        if: success() && github.event.inputs.create_release != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="flm android ${{ steps.ver.outputs.version }}"
          FILE="flm-${{ steps.ver.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            gh release create "$TAG" "$FILE" \
              --title "$TITLE" \
              --notes "Debug-signed universal APK built from ${{ github.sha }} (run #${{ github.run_number }}). Installs on arm64/x86_64 Android 7.0+; sideload it directly, no ADB needed." \
              --latest
          fi
